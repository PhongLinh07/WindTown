<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<title>Template — Form Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0F1120;display:flex;justify-content:center;align-items:flex-start;padding:24px;min-height:100vh;font-family:'Segoe UI','Microsoft YaHei UI',sans-serif}
:root{
  --bg:#1A1D2E;--card:#1E2235;--dark:#151824;--input:#262B42;
  --fg:#E8ECF0;--fg2:#7B8BB2;--fg3:#3D4A6A;
  --accent:#4A9EFF;--border:rgba(255,255,255,0.07);
  --success:#4CAF50;--warn:#F59E0B;--danger:#E05555;
}
.wrap{background:var(--bg);border-radius:14px;overflow:hidden;border:1px solid var(--border);width:100%;max-width:1200px;min-height:640px;display:flex;flex-direction:column}
.toolbar{background:var(--dark);padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:0 12px;height:34px;flex:1;max-width:320px}
.search-wrap input{background:transparent;border:none;outline:none;color:var(--fg);font-size:12.5px;width:100%}
.search-wrap input::placeholder{color:var(--fg2)}
.btn-pri{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 16px;height:34px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.content{flex:1;display:flex;flex-direction:column}
.tbl-wrap{flex:1;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl thead tr{position:sticky;top:0}
.tbl th{background:var(--dark);color:var(--accent);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.tbl td{color:var(--fg);padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.tbl tr:hover td{background:rgba(74,158,255,.04);cursor:pointer}
.footer{background:var(--dark);padding:8px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--fg2);flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="search-wrap">
      <input placeholder="Tìm kiếm..." oninput="filterTable(this.value)"/>
    </div>
    <div style="flex:1"></div>
    <button class="btn-pri" onclick="addItem()">Thêm mới</button>
  </div>

  <div class="content">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th style="width:60px">ID</th>
          <th>Tên</th>
          <th>Trạng thái</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="footer">
      <span id="rowInfo">Hiển thị 0 mục</span>
      <span>Page 1</span>
    </div>
  </div>
</div>

<script>
const DATA=[
  {id:1,name:'Mẫu 1',status:'Active'},
  {id:2,name:'Mẫu 2',status:'Inactive'},
  {id:3,name:'Mẫu 3',status:'Active'},
];
let filtered=[...DATA];

function render(data){
  const tb=document.getElementById('tbody');
  if(!data.length){tb.innerHTML='<tr><td colspan="3" style="text-align:center;padding:40px;color:#3D4A6A">Không có dữ liệu</td></tr>';return}
  tb.innerHTML=data.map(i=>`<tr><td>${i.id}</td><td>${i.name}</td><td>${i.status}</td></tr>`).join('');
  document.getElementById('rowInfo').textContent=`Hiển thị ${data.length} mục`;
}

function filterTable(q){
  filtered=q?DATA.filter(i=>i.name.toLowerCase().includes(q.toLowerCase())):[...DATA];
  render(filtered);
}

function addItem(){alert('Thêm mới (mock)');}

render(DATA);
</script>
</body>
</html>
